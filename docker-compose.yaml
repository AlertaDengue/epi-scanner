services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_URL_PREFIX: ${NEXT_PUBLIC_URL_PREFIX:-}
        FRONTEND_PORT: ${FRONTEND_PORT:-3000}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_URL_PREFIX=${NEXT_PUBLIC_URL_PREFIX:-}
      - EPISCANNER_API_URL=${EPISCANNER_API_URL}
      - EPISCANNER_API_KEY=${EPISCANNER_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${FRONTEND_PORT:-3000}${NEXT_PUBLIC_URL_PREFIX:-}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
